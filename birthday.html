<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f8dce5" />
<title>Happy Birthday, My Baby!</title>
<style>
  .d-img{
      border-radius: 25px;
    border: 2px solid #9d26ff;
    padding: 5px;
  }
    .d-img1{
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      margin-bottom: 10px;
    padding: 2px;
  }
  :root{--pink:#c65b7d;--deep:#a84468;--pale:#fff5f7;--ink:#684653;--card:#fffafb}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px 14px;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background-color:#f8e9e9;background-image:linear-gradient(rgba(255,255,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.28) 1px,transparent 1px),linear-gradient(rgba(194,142,153,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(194,142,153,.10) 1px,transparent 1px);background-size:34px 34px,34px 34px,8px 8px,8px 8px;overflow-x:hidden}
  .app{width:min(100%,440px);text-align:center;position:relative;z-index:1}
  .screen{display:none;animation:appear .55s ease both}.screen.active{display:block}
  @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .sticker{width:116px;height:116px;margin:0 auto 18px;border:5px solid #fff;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#b8e6df 0 50%,#ffe6a8 50%);box-shadow:0 5px 14px #80515b25;transform:rotate(-2deg);font-size:65px}
  h1{font-size:clamp(28px,8vw,39px);letter-spacing:1px;color:#b95876;margin:10px 0 14px;text-shadow:1px 1px #fff}
  .sub{font-size:16px;margin:0 0 22px;line-height:1.6}
  .face{font-size:14px;margin-top:-14px;margin-bottom:18px;color:#966b78}
  .btn{border:0;border-radius:999px;background:var(--pink);color:white;padding:12px 24px;font:600 14px Arial,sans-serif;cursor:pointer;box-shadow:0 4px 0 #a74668;transition:transform .15s,background .15s;margin:5px;min-width:104px}
  .btn:hover{background:var(--deep);transform:translateY(-2px)}.btn:active{transform:translateY(1px);box-shadow:0 2px 0 #a74668}
  .btn.soft{background:#d98aa2;box-shadow:0 4px 0 #bd6b87}.btn.light{background:#f2c6d3;color:#85465c;box-shadow:0 4px 0 #dba3b4}
  .envelope-wrap{margin:34px auto 22px;position:relative;width:190px;height:132px;filter:drop-shadow(0 8px 9px #754a5925)}
  .envelope{position:absolute;inset:0;background:#f4cbd7;border:1px solid #e5aebf;border-radius:5px;overflow:hidden}
  .envelope:before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,transparent 49.5%,#e7afc0 50%,transparent 50.7%),linear-gradient(215deg,transparent 49.5%,#e7afc0 50%,transparent 50.7%)}
  .flap{position:absolute;top:0;left:0;width:0;height:0;border-left:95px solid transparent;border-right:95px solid transparent;border-top:73px solid #f9dce4;transform-origin:top;transition:transform .55s;z-index:2}
  .envelope.open .flap{transform:rotateX(180deg)}
  .letter{position:absolute;z-index:1;left:15px;right:15px;bottom:8px;height:100px;background:#fffafb;border-radius:4px;transition:transform .6s;display:grid;place-items:center;color:#bd6b87;font-size:22px}
  .envelope.open .letter{transform:translateY(-58px)}
  .tiny{font-size:13px;color:#9a7480}
  .letter-card{background:rgba(255,250,251,.96);border:1px solid #f1d6de;border-radius:20px;padding:22px 23px 18px;box-shadow:0 12px 35px #82546620;text-align:left;max-height:72svh;overflow:auto}
  .letter-head{text-align:center;background:#f7dce4;margin:-22px -23px 18px;padding:16px;border-radius:20px 20px 0 0;color:#75475a;font-weight:bold;letter-spacing:.4px}
  .letter-card p{font-size:15px;line-height:1.75;margin:0 0 13px}.signature{text-align:center;color:#c05c7e;font-size:19px;margin-top:8px}
  .actions{text-align:center;margin-top:14px}
  .custom-panel{display:none;text-align:left;background:#fffafb;border:1px solid #f0d5dd;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 8px 24px #80515b15}
  .custom-panel.show{display:block}.custom-panel label{display:block;font:600 12px Arial,sans-serif;margin:10px 0 5px;color:#986276}
  input,textarea{width:100%;border:1px solid #e8c2ce;border-radius:10px;padding:11px;background:#fff;font:14px Arial,sans-serif;color:#684653;outline-color:#cf7894}textarea{min-height:100px;resize:vertical}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}.piece{position:absolute;top:-20px;width:8px;height:13px;opacity:.9;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110svh,0) rotate(900deg);opacity:.2}}
  .heart{color:#d45f84}.footer{font:11px Arial,sans-serif;color:#a27d89;margin-top:23px}
  @media(max-width:380px){body{padding:16px 12px}.letter-card{padding:18px}.letter-head{margin:-18px -18px 15px}.btn{padding:11px 18px;min-width:96px}.sticker{width:100px;height:100px;font-size:56px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="confetti" aria-hidden="true"></div>
<main class="app">
  <section class="screen active" id="welcome">
    <!-- <div class="sticker" aria-hidden="true">
      <img src="img/photo_2026-11-20_11-13-00.jpg" alt="Girl in a jacket" width="100%" height="100%">
    </div> -->
    <div >
      <img src="img/p3.jpg" alt="Girl in a jacket" width="50%" height="50%" class="d-img">
    </div>
    <h1>Happy Birthday</h1>
    <p class="sub" id="introName">My Darling Oun Sml 😘💞🐷</p>
    <p class="face">(｡♥‿♥｡)</p>
    <button class="btn" onclick="showScreen('envelopeScreen')">Next!! ♪</button><br>
    <div class="custom-panel" id="customPanel">
      
      <label for="nameInput">Birthday person's name</label><input id="nameInput" value="my baby" maxlength="45">
      <img src="img/photo_2026-11-20_11-13-00.jpg" alt="">
      <label for="messageInput">Your birthday message</label><textarea id="messageInput">
        Happy Birthday My Darling, Today isn't just about celebrating your birthday, it's about celebrating that the most wonderful,
        
        special person I know was born. I just wanna tell you that you amazing person that I've met, I feel so lucky to call you mine.
        
        You've shown me what true love feels like, and every day with you is a beautiful. I wish you the best in your birthday and
        
        achieve the things you want to achieve. And I want you to know I'm so grateful that I met you, I just want to say thank you.
        
        Thank you for being you. Thank you for letting me love you. And thank you for loving me right back Oun Sml.
        😘🐷💜</textarea>
      <button class="btn" onclick="saveCustom()">Save changes</button>
    </div>
  </section>

  <section class="screen" id="envelopeScreen">
    <!-- <div class="sticker" aria-hidden="true">💌</div> -->
     <div >
      <img src="img/p1.jpg" alt="Girl in a jacket" width="50%" height="50%" class="d-img">
    </div>  
    <h1>A little surprise</h1>
    <p class="sub">I made something special for you...</p>
    <div class="envelope-wrap"><div class="envelope" id="envelope"><div class="letter">♥</div><div class="flap"></div></div></div>
    <button class="btn" onclick="openLetter()">Open it</button>
    <button class="btn soft" onclick="tryAgain()">No ty</button>
  </section>

  <section class="screen" id="tryScreen">
    <div class="sticker" aria-hidden="true">🥺</div>
    <p class="sub">Awh... Let's try again?</p>
    <button class="btn" onclick="showScreen('envelopeScreen')">Again..?</button>
  </section>

  <section class="screen" id="letterScreen">
    <article class="letter-card">
      
      <div class="letter-head"><span class="heart">♥</span> Happy Birthday <span id="letterName">my baby</span>!!</div>
      <div class="d-img1">
      <img src="img/p4.jpg" alt="Girl in a jacket" width="50%" height="50%" style="margin-right: 10px;border-radius: 5px;">
      <img src="img/p5.jpg" alt="Girl in a jacket" width="50%" height="50%" style="border-radius: 5px;">
    </div>
      <div id="letterMessage"></div>
      <div class="signature">♥ ♥ ♥</div>
    </article>
    <div class="actions">
      <!-- <button class="btn soft" onclick="toggleCustomize(true)">✎ Customize</button> -->
      <button class="btn" onclick="startOver()">Start Over ↻</button>
    </div>
    <div class="custom-panel" id="letterCustomPanel">
      <label for="nameInput2">Birthday person's name</label><input id="nameInput2" value="my baby" maxlength="45">
      <label for="messageInput2">Your birthday message</label><textarea id="messageInput2"></textarea>
      <button class="btn" onclick="saveCustom()">Save changes</button>
    </div>
  </section>
  <p class="footer">MADE WITH <span class="heart">♥</span> JUST FOR YOU</p>
</main>
<script>
const defaultMessage = document.getElementById('messageInput').value;
let birthdayName = 'my baby';
let birthdayMessage = defaultMessage;
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}

function saveCustom(){
  const letterPanel=document.getElementById('letterCustomPanel');
  const fromLetter=letterPanel.classList.contains('show');
  const name=(document.getElementById(fromLetter?'nameInput2':'nameInput').value.trim()||'my baby');
  const message=document.getElementById(fromLetter?'messageInput2':'messageInput').value.trim()||defaultMessage;
  birthdayName=name;birthdayMessage=message;
  document.getElementById('introName').textContent=name;
  document.getElementById('letterName').textContent=name;
  document.getElementById('letterMessage').innerHTML=message.split(/\n\s*\n/).map(p=>'<p>'+escapeHTML(p).replace(/\n/g,'<br>')+'</p>').join('');
  document.getElementById('customPanel').classList.remove('show');letterPanel.classList.remove('show');
  if(document.getElementById('letterScreen').classList.contains('active'))celebrate();
}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openLetter(){const env=document.getElementById('envelope');env.classList.add('open');setTimeout(()=>{showScreen('letterScreen');saveRender();celebrate();},650);}
function saveRender(){document.getElementById('letterName').textContent=birthdayName;document.getElementById('letterMessage').innerHTML=birthdayMessage.split(/\n\s*\n/).map(p=>'<p>'+escapeHTML(p).replace(/\n/g,'<br>')+'</p>').join('');}
function tryAgain(){showScreen('tryScreen');}
function startOver(){document.getElementById('envelope').classList.remove('open');showScreen('welcome');}
function celebrate(){const root=document.getElementById('confetti');const colors=['#e77b9d','#f4c85d','#9fd8ce','#b5a4e8','#fff'];for(let i=0;i<95;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'vw';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.setProperty('--drift',(Math.random()*220-110)+'px');p.style.animationDuration=(2.6+Math.random()*2.5)+'s';p.style.animationDelay=(Math.random()*.8)+'s';p.style.borderRadius=Math.random()>.5?'50%':'2px';root.appendChild(p);setTimeout(()=>p.remove(),6000);}}
document.getElementById('letterName').textContent=birthdayName;saveRender();
</script>
</body>
</html>
